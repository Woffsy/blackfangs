<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inactivity Reporting</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/inactivity.css">
    </head>
    <body>
        <header class="navbar">
            <div class="nav-logo">
                <img src="../assets/images/logo.jpg" alt="Website logo">
            </div>

            <button class="hamburger" id="hamburger">☰</button>

            <nav class="nav-links" role="navigation">
                <a href="../index.html">Home</a>
                <a href="members.html">Members</a>
                <a href="history.html">History</a>
                <a href="player-info.html">Player Info</a>
                <a href="login.html">Log In</a>
            </nav>
        </header>
        <main class="inactivity-page">
            <h1>Inactivity Reporting</h1>

            <form class="inactivity-form" id="inactivity-form">
                <div class="form">
                    <label for="inactive-until">Date Inactive Until (required)</label>
                    <input type="text" id="inactive-until" name="inactiveUntil" placeholder="DD/MM/YYYY">
                </div>

                <div class="form">
                    <label for="inactive-reason">Reason for Inactivity (required)</label>
                    <select id="inactive-reason" name="inactiveReason">
                        <option value="">Select a reason...</option>
                        <option value="health">Illness / Injury</option>
                        <option value="vacation">Vacation / Travel</option>
                        <option value="burnout">Burnout / Break</option>
                        <option value="exams">Exams / Studies / Work</option>
                        <option value="equipment">Technology Issue</option>
                        <option value="irl">IRL Issues</option>
                        <option value="banned">Tempbanned from Wynn</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form">
                    <label for="inactive-notes">Notes (optional)</label>
                    <textarea id="inactive-notes" name="inactiveNotes" rows="4" placeholder="Additional info..."></textarea>
                </div>

                <div class="form">
                    <button type="submit" class="submit-button">Submit Report</button>
                </div>
            </form>
        </main>
        <script src="../ensureMember.js"></script>
        <script src="../js/auth-status.js"></script>
        <script src="../js/hamburger.js"></script>
        <script src="../js/corruption-message.js"></script>
    </body>
</html>
